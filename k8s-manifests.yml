# ============================================================
# Labo 05 - Store Manager sur la grappe Kubernetes de l'ETS
# Namespace : celui du contexte kubectl (log430-espace-etudiant-17)
#
# Prerequis (hors de ce fichier) : le ConfigMap "db-init", cree avec
#   kubectl create configmap db-init --from-file=db-init
# ============================================================

# ------------------------------------------------------------
# Secret : identifiants de la base de donnees
# ------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_USER: labo05
  DB_PASSWORD: labo05
  MYSQL_ROOT_PASSWORD: root

---
# ------------------------------------------------------------
# ConfigMap : variables d'environnement de l'application
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: labo05_db
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  KAFKA_HOST: ""

---
# ------------------------------------------------------------
# ConfigMap : configuration de KrakenD pour la grappe
# (les hotes utilisent des tirets : les underscores sont interdits)
# ------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: krakend-config
data:
  krakend.json: |
    {
      "version": 3,
      "name": "Store Manager API Gateway",
      "timeout": "5s",
      "cache_ttl": "300s",
      "output_encoding": "json",
      "port": 8080,
      "endpoints": [
        {
          "endpoint": "/payments-api/payments",
          "method": "POST",
          "backend": [
            {
              "url_pattern": "/payments",
              "host": ["http://payments-api:5009"],
              "timeout": "5s"
            }
          ]
        },
        {
          "endpoint": "/payments-api/payments/process/{payment_id}",
          "method": "POST",
          "backend": [
            {
              "url_pattern": "/payments/process/{payment_id}",
              "host": ["http://payments-api:5009"],
              "timeout": "5s"
            }
          ]
        },
        {
          "endpoint": "/store-manager-api/orders",
          "method": "POST",
          "backend": [
            {
              "url_pattern": "/orders",
              "host": ["http://store-manager:5000"]
            }
          ],
          "extra_config": {
            "qos/ratelimit/router": {
              "max_rate": 200,
              "every": "1m"
            }
          }
        },
        {
          "endpoint": "/store-manager-api/orders",
          "method": "PUT",
          "backend": [
            {
              "url_pattern": "/orders",
              "host": ["http://store-manager:5000"]
            }
          ]
        },
        {
          "endpoint": "/store-manager-api/test/slow/{delay}",
          "method": "GET",
          "backend": [
            {
              "url_pattern": "/test/slow/{delay}",
              "host": ["http://store-manager:5000"],
              "timeout": "5s"
            }
          ]
        }
      ]
    }

---
# ============================================================
# MySQL
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # storageClassName omis : la classe par defaut (default-storage) s'applique

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate   # le volume est ReadWriteOnce : un seul pod a la fois
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.7
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: db-init
          configMap:
            name: db-init

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306

---
# ============================================================
# Redis
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# ============================================================
# Store Manager
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-manager
  template:
    metadata:
      labels:
        app: store-manager
    spec:
      # Attend que MySQL et Redis acceptent des connexions avant de demarrer
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do echo "en attente de mysql"; sleep 3; done
              until nc -z redis 6379; do echo "en attente de redis"; sleep 3; done
      containers:
        - name: store-manager
          image: ghcr.io/youssefhamdouni/log430-labo5-a26:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: store-manager
spec:
  type: NodePort   # pas de nodePort impose : Kubernetes en attribue un libre
  selector:
    app: store-manager
  ports:
    - port: 5000
      targetPort: 5000

---
# ============================================================
# KrakenD API Gateway
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: devopsfaith/krakend:2.7
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /__health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: krakend-config
              mountPath: /etc/krakend/krakend.json
              subPath: krakend.json
      volumes:
        - name: krakend-config
          configMap:
            name: krakend-config

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort   # pas de nodePort impose : Kubernetes en attribue un libre
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080